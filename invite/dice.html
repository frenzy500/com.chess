<head>

  <meta property="og:site_name" content="Chess">

  <meta property="og:description" content="Roll two dice to dictate which pieces can move — roll doubles for a wild turn and capture the King. Click to join live.">
  <meta property="og:image" content="https://frenzy500.github.io/com.chess/assets/og/dice.jpg">

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var raw = params.get("game") || params.get("code") || "";
      var clean = raw.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      var target = /^[A-Z0-9]{5}$/.test(clean)
        ? "../?game=" + encodeURIComponent(clean)
        : "../?variant=dice";
      document.addEventListener("DOMContentLoaded", function () {
        var link = document.getElementById("join-link");
        if (link) link.setAttribute("href", target);
      });
      window.location.replace(target);
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #262522;
      color: #f4f2ed;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a {
      color: #4fd1c5;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <p>Opening Dice Chess match… <a id="join-link" href="../?variant=dice">Join now</a></p>
</body>
